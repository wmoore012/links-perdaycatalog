<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Links — CatalogLAB™</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <section class="profile">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <img class="avatar" src="avatar.jpg" alt="Your name">
      </div>
      <h1 class="title">J Smash</h1>
      <p class="subtitle">CatalogLAB™ • Music Data & Demo</p>
    </section>

    <nav class="links" aria-label="links">
      <a class="link" href="https://lab.perdaycatalog.com" target="_blank" rel="noopener noreferrer">
        <span class="icon-circle">📈</span>
        <span class="label">CatalogLAB™</span>
      </a>
      <a class="link" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon-circle">📸</span>
        <span class="label">Instagram</span>
      </a>
      <a class="link" href="mailto:you@perdaycatalog.com">
        <span class="icon-circle">✉️</span>
        <span class="label">Contact</span>
      </a>
    </nav>

    <p class="footer">links.perdaycatalog.com</p>
  </main>
</body>
</html>
